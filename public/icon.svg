<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Spin Drift app icon: a mil reticle on the Dark theme background.
       Everything sits inside the 40% safe circle so round (maskable) crops keep it. -->
  <rect width="512" height="512" rx="96" fill="#121814"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#e8e4d8" stroke-width="16"/>
  <!-- Heavy posts -->
  <path d="M256 84v108M256 320v108M84 256h108M320 256h108" stroke="#e8e4d8" stroke-width="16" stroke-linecap="round"/>
  <!-- Fine crosshair with mil marks -->
  <path d="M192 256h128M256 192v128" stroke="#e8e4d8" stroke-width="5" stroke-linecap="round"/>
  <path d="M224 246v20M288 246v20M246 224h20M246 288h20" stroke="#e8e4d8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="11" fill="#e0632b"/>
</svg>
